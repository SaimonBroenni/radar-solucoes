<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar de Soluções</title>
</head>
<body style="margin:0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --bg:#f9f9f7;
    --surface:#ffffff;
    --surface-2:#f3f3f0;
    --surface-3:#ececE7;
    --ink:#0b0b0b;
    --ink-2:#52514e;
    --muted:#898781;
    --line:#e1e0d9;
    --line-strong:rgba(11,11,11,0.10);
    --accent:#4fb84f;
    --accent-ink:#0d1a12;
    --accent-soft:#e9f7ea;
    --accent-soft-line:#bfe6c0;
    --good:#0ca30c;
    --warning:#c98500;
    --warning-fill:#fab219;
    --serious:#d1602f;
    --serious-fill:#ec835a;
    --critical:#d03b3b;
    --info-blue:#4a3aa7;
    --info-magenta:#b5507c;
    --rodband-1:#fbe8c2; --rodband-2:#dbe2e6; --rodband-3:#cdf2d8; --rodband-4:#e2d9f2;
    --rodband-5:#fbdfc0; --rodband-6:#d3e9fb; --rodband-7:#ececE7; --rodband-8:#fbdcbd;
    --meta-good-bg:rgba(12,163,12,0.16); --meta-warn-bg:rgba(201,133,0,0.18); --meta-cold-bg:rgba(74,58,167,0.14); --meta-neutral-bg:rgba(230,170,90,0.13);
    --shadow-1: 0 1px 2px rgba(11,11,11,0.06), 0 1px 1px rgba(11,11,11,0.04);
    --shadow-2: 0 8px 24px rgba(11,11,11,0.12), 0 2px 6px rgba(11,11,11,0.06);
    --radius-s:8px;
    --radius-m:12px;
    --radius-l:18px;
    --font-display:'Poppins', system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-body:'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#1c222b;
      --surface:#242a33;
      --surface-2:#2b323c;
      --surface-3:#343b45;
      --ink:#ffffff;
      --ink-2:#c9ccd1;
      --muted:#8b9099;
      --line:#3a414b;
      --line-strong:rgba(255,255,255,0.14);
      --accent:#66cb66;
      --accent-ink:#12261a;
      --accent-soft:rgba(102,203,102,0.16);
      --accent-soft-line:rgba(102,203,102,0.38);
      --good:#0ca30c;
      --warning:#fab219;
      --warning-fill:#fab219;
      --serious:#ec835a;
      --serious-fill:#ec835a;
      --critical:#e0605f;
      --info-blue:#9085e9;
      --info-magenta:#d55181;
      --rodband-1:rgba(250,178,25,0.16); --rodband-2:rgba(163,178,194,0.16); --rodband-3:rgba(20,200,110,0.16); --rodband-4:rgba(160,120,220,0.18);
      --rodband-5:rgba(230,140,60,0.18); --rodband-6:rgba(60,140,230,0.16); --rodband-7:rgba(255,255,255,0.07); --rodband-8:rgba(230,120,60,0.18);
      --meta-good-bg:rgba(12,163,12,0.22); --meta-warn-bg:rgba(250,178,25,0.22); --meta-cold-bg:rgba(144,133,233,0.24); --meta-neutral-bg:rgba(250,178,25,0.10);
      --shadow-1: 0 1px 2px rgba(0,0,0,0.4);
      --shadow-2: 0 12px 32px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#1c222b;
    --surface:#242a33;
    --surface-2:#2b323c;
    --surface-3:#343b45;
    --ink:#ffffff;
    --ink-2:#c9ccd1;
    --muted:#8b9099;
    --line:#3a414b;
    --line-strong:rgba(255,255,255,0.14);
    --accent:#66cb66;
    --accent-ink:#12261a;
    --accent-soft:rgba(102,203,102,0.16);
    --accent-soft-line:rgba(102,203,102,0.38);
    --good:#0ca30c;
    --warning:#fab219;
    --warning-fill:#fab219;
    --serious:#ec835a;
    --serious-fill:#ec835a;
    --critical:#e0605f;
    --info-blue:#9085e9;
    --info-magenta:#d55181;
    --rodband-1:rgba(250,178,25,0.16); --rodband-2:rgba(163,178,194,0.16); --rodband-3:rgba(20,200,110,0.16); --rodband-4:rgba(160,120,220,0.18);
    --rodband-5:rgba(230,140,60,0.18); --rodband-6:rgba(60,140,230,0.16); --rodband-7:rgba(255,255,255,0.07); --rodband-8:rgba(230,120,60,0.18);
    --meta-good-bg:rgba(12,163,12,0.22); --meta-warn-bg:rgba(250,178,25,0.22); --meta-cold-bg:rgba(144,133,233,0.24); --meta-neutral-bg:rgba(250,178,25,0.10);
    --shadow-1: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-2: 0 12px 32px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display); margin:0; text-wrap:balance; color:var(--ink);}
  p{margin:0;}
  a{color:var(--accent);}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit; color:var(--ink);}
  ::placeholder{color:var(--muted); opacity:1;}
  .tabular{font-variant-numeric:tabular-nums;}
  [hidden]{display:none!important;}

  /* ---------- Shell / layout ---------- */
  #shell{display:flex; min-height:100%; width:100%;}
  #sidebar{
    width:236px; flex:0 0 236px; background:var(--surface); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:20px 14px; gap:22px; position:sticky; top:0; height:100vh; height:100dvh;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:0 6px;}
  .brand-mark{
    width:34px; height:34px; border-radius:10px; background:linear-gradient(155deg, var(--accent), #1c8a4a);
    display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-display); font-weight:800; font-size:15px; flex:none;
    box-shadow: var(--shadow-1);
  }
  .brand-text{display:flex; flex-direction:column; line-height:1.2;}
  .brand-text b{font-family:var(--font-display); font-weight:800; font-size:14.5px; letter-spacing:-0.01em;}
  .brand-text span{font-size:11px; color:var(--muted);}
  nav.mainnav{display:flex; flex-direction:column; gap:2px;}
  .navlink{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; color:var(--ink-2);
    font-size:13.5px; font-weight:600; cursor:pointer; border:1px solid transparent; user-select:none;
  }
  .navlink:hover{background:var(--surface-2);}
  .navlink.active{background:var(--accent-soft); color:var(--accent); border-color:var(--accent-soft-line);}
  .navlink svg{flex:none; width:17px; height:17px;}
  .navlink .navlink-badge{margin-left:auto; font-size:10px; font-weight:700; background:var(--surface-3); color:var(--muted); padding:1px 6px; border-radius:999px;}
  .nav-group-label{font-size:10.5px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); padding:10px 10px 2px;}
  .sidebar-foot{margin-top:auto; display:flex; flex-direction:column; gap:8px; padding-top:12px; border-top:1px solid var(--line);}
  .identity-chip{display:flex; align-items:center; gap:9px; padding:6px; border-radius:10px;}
  .identity-avatar{width:30px; height:30px; border-radius:50%; flex:none; object-fit:cover; background:var(--surface-3); border:1px solid var(--line);}
  .identity-meta{display:flex; flex-direction:column; min-width:0;}
  .identity-meta b{font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .identity-meta span{font-size:11px; color:var(--muted);}
  .role-pill{font-size:10px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; padding:2px 7px; border-radius:999px; width:fit-content;}
  .role-pill.owner{background:var(--accent-soft); color:var(--accent);}
  .role-pill.editor{background:var(--surface-3); color:var(--ink-2);}
  .role-pill.visitante{background:rgba(137,135,129,0.16); color:var(--muted);}
  .role-pill.comentarista{background:var(--meta-cold-bg); color:var(--info-blue);}

  #topbar{display:none; position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--line); padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top,0px)); align-items:center; gap:10px;}
  #topbar .brand{flex:1;}
  #menu-btn{width:36px; height:36px; border-radius:9px; border:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; flex:none;}

  #main{flex:1; min-width:0; display:flex; flex-direction:column;}
  #content{flex:1; padding:26px 32px 60px; max-width:1180px; width:100%; margin:0 auto;}
  #content.content-wide{max-width:1560px;}
  .view{display:flex; flex-direction:column; gap:22px;}
  .view-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .view-head h1{font-size:22px; font-weight:800; letter-spacing:-0.01em;}
  .view-head p.sub{color:var(--ink-2); font-size:13px; margin-top:3px;}
  .view-head-actions{display:flex; gap:8px; flex-wrap:wrap;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px; font-size:13.5px; font-weight:700;
    padding:9px 16px; border-radius:9px; border:1px solid transparent; cursor:pointer; white-space:nowrap;
    transition:filter .12s ease, background .12s ease;
  }
  .btn:active{filter:brightness(0.94);}
  .btn:disabled{opacity:.55; cursor:not-allowed;}
  .btn svg{width:15px; height:15px; flex:none;}
  .btn-primary{background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow-1);}
  .btn-secondary{background:var(--surface); color:var(--ink); border-color:var(--line);}
  .btn-secondary:hover{background:var(--surface-2);}
  .btn-ghost{background:transparent; color:var(--ink-2); border-color:transparent;}
  .btn-ghost:hover{background:var(--surface-2); color:var(--ink);}
  .btn-danger{background:transparent; color:var(--critical); border-color:var(--line);}
  .btn-danger:hover{background:rgba(208,59,59,0.08);}
  .btn-sm{padding:6px 11px; font-size:12.5px; border-radius:7px;}
  .icon-btn{width:30px; height:30px; border-radius:7px; border:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--ink-2); cursor:pointer; flex:none;}
  .icon-btn:hover{background:var(--surface-2); color:var(--ink);}
  .icon-btn svg{width:15px; height:15px;}

  /* ---------- Cards / sections ---------- */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); box-shadow:var(--shadow-1);}
  .card-pad{padding:20px;}
  .block{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden;}
  .block-head{display:flex; align-items:center; gap:10px; padding:15px 20px; border-bottom:1px solid var(--line); background:var(--surface-2);}
  .block-head .num{width:22px; height:22px; border-radius:7px; background:var(--accent-soft); color:var(--accent); font-family:var(--font-display); font-weight:800; font-size:11.5px; display:flex; align-items:center; justify-content:center; flex:none;}
  .block-head h3{font-size:14px; font-weight:700;}
  .block-head span.hint{margin-left:auto; font-size:11.5px; color:var(--muted);}
  .block-body{padding:20px; display:grid; grid-template-columns:repeat(3,1fr); gap:16px 18px;}
  .block-body.cols-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:900px){ .block-body{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:640px){ .block-body{grid-template-columns:1fr;} }

  /* ---------- Form fields ---------- */
  .field{display:flex; flex-direction:column; gap:6px; min-width:0;}
  .field.span-2{grid-column:span 2;}
  .field.span-3{grid-column:1/-1;}
  @media (max-width:640px){ .field.span-2, .field.span-3{grid-column:1/-1;} }
  .field label{font-size:12px; font-weight:700; color:var(--ink-2); display:flex; align-items:center; gap:5px;}
  .field label .req{color:var(--critical); font-weight:700;}
  .field label .opt{font-size:10px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; background:var(--surface-3); padding:1px 6px; border-radius:999px; margin-left:2px;}
  .input, select.input, textarea.input{
    width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--line); background:var(--surface);
    font-size:13.5px; color:var(--ink); outline:none; transition:border-color .12s, box-shadow .12s;
  }
  .input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  select.theme-select{width:auto; flex:none; padding:6px 26px 6px 10px; font-size:12px; font-weight:700; cursor:pointer;}
  #sidebar select.theme-select{align-self:flex-start;}
  .field .errtext{font-size:11.5px; color:var(--critical); display:none; align-items:center; gap:5px;}
  .field.field--error .input{border-color:var(--critical); background:rgba(208,59,59,0.05);}
  .field.field--error .errtext{display:flex;}
  .field .fieldhint{font-size:11px; color:var(--muted);}
  .cnpj-lookup-status{font-size:11.5px; min-height:14px; margin-top:4px;}
  .cnpj-lookup-status a{color:var(--accent); font-weight:600; text-decoration:none; display:inline-flex; align-items:center; gap:5px;}
  .cnpj-lookup-status a:hover{text-decoration:underline;}
  .cnpj-lookup-status a svg{width:13px; height:13px;}
  .date-input{position:relative;}
  .date-input svg{position:absolute; right:10px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--muted); pointer-events:none;}

  /* ---------- Searchable select ---------- */
  .ss{position:relative;}
  .ss-input-wrap{position:relative;}
  .ss-input-wrap .chev{position:absolute; right:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--muted); pointer-events:none; display:block;}
  .ss-input-wrap .chev svg{width:100%; height:100%; display:block;}
  .ss input.input{padding-right:30px; cursor:text;}
  .ss-panel{
    position:fixed; z-index:500; background:var(--surface); border:1px solid var(--line);
    border-radius:10px; box-shadow:var(--shadow-2); max-height:260px; overflow:auto; padding:5px; display:none;
  }
  .ss-option{padding:8px 10px; border-radius:7px; cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .ss-option:hover, .ss-option.hl{background:var(--accent-soft); color:var(--accent);}
  .ss-empty{padding:14px 10px; text-align:center; color:var(--muted); font-size:12.5px;}
  .ms-box{width:16px; height:16px; flex:none; border:1.5px solid var(--muted); border-radius:4px; display:inline-flex; align-items:center; justify-content:center; background:var(--surface);}
  .ms-box.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .ms-box.part{border-color:var(--accent); color:var(--accent); font-weight:800; font-size:14px; line-height:1;}
  .ss-option.ms-all{border-bottom:1px solid var(--line); border-radius:7px 7px 0 0; margin-bottom:3px;}
  .ms-box svg{width:11px; height:11px; stroke-width:3;}
  .ss-option[aria-selected="true"]{font-weight:600;}

  /* ---------- Modal ---------- */
  #modal-layer{position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; padding:20px;}
  #modal-layer.open{display:flex;}
  .modal-overlay{position:absolute; inset:0; background:rgba(11,11,11,0.45); backdrop-filter:blur(1px);}
  .modal{position:relative; width:100%; max-width:460px; background:var(--surface); border-radius:var(--radius-l); box-shadow:var(--shadow-2); padding:26px; display:flex; flex-direction:column; gap:14px; max-height:88vh; overflow:auto;}
  .modal.wide{max-width:720px;}
  .modal.full{max-width:1240px; width:94vw; max-height:92vh;}
  .modal-icon{width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); color:var(--accent); flex:none;}
  .modal-icon svg{width:22px; height:22px;}
  .modal h2{font-size:17px; font-weight:800;}
  .modal p.desc{font-size:13.5px; color:var(--ink-2);}
  .modal-actions{display:flex; justify-content:flex-end; gap:9px; margin-top:6px; flex-wrap:wrap;}
  .modal-actions .btn{flex:none;}

  /* ---------- Toast ---------- */
  #toast-stack{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; width:100%; max-width:420px; padding:0 16px;}
  .toast{display:flex; align-items:flex-start; gap:9px; background:var(--ink); color:var(--bg); padding:11px 14px; border-radius:10px; box-shadow:var(--shadow-2); font-size:13px; font-weight:500; width:100%; animation:toastin .18s ease;}
  .toast svg{width:17px; height:17px; flex:none; margin-top:1px;}
  .toast.success{background:#0f3d1d; color:#d9f7dd;}
  .toast.error{background:#4a1414; color:#ffdede;}
  @keyframes toastin{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- Badges / pills ---------- */
  .pill{display:inline-flex; align-items:center; gap:6px; padding:3px 9px 3px 7px; border-radius:999px; font-size:12px; font-weight:600; background:var(--surface-3); color:var(--ink-2); white-space:nowrap;}
  .pill .dot{width:7px; height:7px; border-radius:50%; flex:none; background:currentColor;}
  .pill[data-status="Validado"]{color:var(--good);}
  .pill[data-status="Aguardando Aceite"]{color:var(--warning);}
  .pill[data-status="Recusado"]{color:var(--critical);}
  .pill[data-status="Reatribuído"]{color:var(--serious);}
  .pill[data-status="No-show EC"]{color:var(--info-blue);}
  .pill[data-status="No-show Lead"]{color:var(--info-magenta);}

  /* ---------- Toolbar / filters ---------- */
  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .search-box{position:relative; flex:1; min-width:200px; max-width:340px;}
  .search-box svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--muted);}
  .search-box input{padding-left:32px;}
  .filters-panel{display:none; grid-template-columns:repeat(4,1fr); gap:12px 14px;}
  .filters-panel.open{display:grid;}
  @media (max-width:900px){ .filters-panel{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:520px){ .filters-panel{grid-template-columns:1fr;} }
  .filters-foot{display:flex; justify-content:space-between; align-items:center; grid-column:1/-1; padding-top:6px; border-top:1px dashed var(--line); margin-top:2px;}

  /* ---------- Table ---------- */
  .table-wrap{overflow-x:auto; border-radius:var(--radius-m); border:1px solid var(--line);}
  table.datatable{width:100%; border-collapse:collapse; min-width:920px; background:var(--surface);}
  table.datatable thead th{
    text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);
    padding:11px 14px; background:var(--surface-2); border-bottom:1px solid var(--line); white-space:nowrap; cursor:pointer; user-select:none; position:sticky; top:0;
  }
  table.datatable thead th:hover{color:var(--ink);}
  table.datatable thead th .sort-ico{display:inline-block; width:9px; margin-left:3px; opacity:.5;}
  table.datatable thead th.sorted .sort-ico{opacity:1; color:var(--accent);}
  table.datatable tbody td{padding:11px 14px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:middle;}
  table.datatable tbody tr{cursor:pointer;}
  table.datatable tbody tr:hover td{background:var(--surface-2);}
  table.datatable tbody tr:last-child td{border-bottom:none;}
  .cell-muted{color:var(--muted);}
  .cell-strong{font-weight:600;}
  .link-ico{color:var(--accent); display:inline-flex;}
  .link-ico svg{width:15px; height:15px;}
  .empty-state{padding:50px 20px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px; color:var(--muted);}
  .empty-state svg{width:38px; height:38px; opacity:.6;}
  .table-foot{display:flex; align-items:center; justify-content:space-between; padding:11px 14px; gap:10px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-2);}
  .pager{display:flex; align-items:center; gap:5px;}
  .pager button{width:28px; height:28px; border-radius:7px; border:1px solid var(--line); background:var(--surface); color:var(--ink-2); cursor:pointer; font-size:12px; font-weight:700;}
  .pager button.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .pager button:disabled{opacity:.4; cursor:not-allowed;}

  /* ---------- Detail drawer ---------- */
  .detail-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px 20px;}
  @media (max-width:560px){ .detail-grid{grid-template-columns:1fr;} }
  .detail-item span.k{display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-bottom:3px;}
  .detail-item span.v{font-size:13.5px; color:var(--ink); word-break:break-word;}
  .audit-strip{display:flex; gap:16px; flex-wrap:wrap; padding:12px 14px; background:var(--surface-2); border-radius:10px; font-size:12px; color:var(--muted);}

  /* ---------- Dashboard ---------- */
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  @media (max-width:980px){ .stat-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:520px){ .stat-grid{grid-template-columns:1fr 1fr;} }
  .stat-tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px 18px; display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow-1); cursor:pointer; transition:box-shadow .12s ease, border-color .12s ease;}
  .stat-tile:hover{box-shadow:var(--shadow-2); border-color:var(--accent-soft-line);}
  .stat-tile .stat-top{display:flex; align-items:center; justify-content:space-between;}
  .stat-tile .stat-label{font-size:12px; font-weight:700; color:var(--ink-2);}
  .stat-tile .stat-dot{width:8px; height:8px; border-radius:50%;}
  .stat-tile .stat-value{font-family:var(--font-display); font-size:26px; font-weight:800; letter-spacing:-0.01em;}
  .charts-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
  @media (max-width:980px){ .charts-grid{grid-template-columns:1fr;} }
  .chart-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:18px 20px;}
  .chart-card h4{font-size:13px; font-weight:700; margin-bottom:14px;}
  .barlist{display:flex; flex-direction:column; gap:10px;}
  .barlist-row{display:grid; grid-template-columns:104px 1fr 40px; gap:10px; align-items:center;}
  .barlist-row .lbl{font-size:12px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .barlist-track{background:var(--surface-3); border-radius:5px; height:10px; overflow:hidden;}
  .barlist-fill{height:100%; border-radius:5px; background:var(--accent);}
  .barlist-row .val{font-size:12px; font-weight:700; text-align:right;}
  .barlist-row.clickable{cursor:pointer; border-radius:6px; transition:background .12s ease; margin:0 -6px; padding:2px 6px;}
  .barlist-row.clickable:hover{background:var(--surface-2);}
  .month-chart{display:flex; align-items:flex-end; gap:6px; height:150px; padding-top:20px;}
  .month-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px; position:relative;}
  .month-col .mval{font-size:10.5px; font-weight:700; color:var(--ink-2);}
  .month-col .mbar{width:100%; max-width:26px; border-radius:5px 5px 2px 2px; background:var(--accent); min-height:2px;}
  .month-col .mlbl{font-size:10px; color:var(--muted); margin-top:2px;}
  .month-col.clickable{cursor:pointer; border-radius:6px; transition:background .12s ease;}
  .month-col.clickable:hover{background:var(--surface-2);}
  .dash-filters{grid-template-columns:repeat(4,1fr); gap:10px;}
  @media (max-width:980px){ .dash-filters{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:520px){ .dash-filters{grid-template-columns:1fr;} }

  /* ---------- Config screen ---------- */
  .config-layout{display:grid; grid-template-columns:230px 1fr; gap:20px; align-items:start;}
  @media (max-width:820px){ .config-layout{grid-template-columns:1fr;} }
  .config-cats{display:flex; flex-direction:column; gap:2px;}
  .config-cat-btn{display:flex; align-items:center; justify-content:space-between; padding:9px 12px; border-radius:9px; cursor:pointer; font-size:13px; font-weight:600; color:var(--ink-2);}
  .config-cat-btn:hover{background:var(--surface-2);}
  .config-cat-btn.active{background:var(--accent-soft); color:var(--accent);}
  .config-cat-btn .count{font-size:11px; color:var(--muted); background:var(--surface-3); padding:1px 7px; border-radius:999px;}
  .config-cat-btn.active .count{background:rgba(255,255,255,0.5); color:var(--accent);}

  /* ---------- Follow hub (Criador de Follow) ---------- */
  .hub-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  @media (max-width:900px){ .hub-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:640px){ .hub-grid{grid-template-columns:1fr;} }
  .hub-card{cursor:pointer; display:flex; flex-direction:column; gap:10px; transition:box-shadow .12s ease, border-color .12s ease;}
  .hub-card:hover{box-shadow:var(--shadow-2); border-color:var(--accent-soft-line);}
  .hub-card-icon{width:40px; height:40px; border-radius:12px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; flex:none;}
  .hub-card-icon svg{width:20px; height:20px;}
  .hub-card h3{font-size:14.5px; font-weight:800;}
  .hub-card p.sub{font-size:12.5px; color:var(--ink-2);}
  #follow-hub-back{margin:-4px 0 8px -6px;}
  .terr-list{display:flex; flex-direction:column; gap:3px; max-height:560px; overflow:auto;}
  .terr-item{padding:9px 11px; border-radius:9px; cursor:pointer; border:1px solid transparent;}
  .terr-item:hover{background:var(--surface-2);}
  .terr-item.active{background:var(--accent-soft); border-color:var(--accent-soft-line);}
  .terr-item .n{font-size:13px; font-weight:700; color:var(--ink);}
  .terr-item.active .n{color:var(--accent);}
  .terr-item .u{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .terr-cities-box{max-height:220px; overflow:auto; font-size:12px; color:var(--ink-2); background:var(--surface-2); border-radius:8px; padding:10px; margin-top:8px; white-space:pre-line; line-height:1.6;}
  .option-row{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:9px; border:1px solid var(--line); background:var(--surface);}
  .option-row + .option-row{margin-top:8px;}
  .option-row.inactive{opacity:.55;}
  .option-row input.inline-edit{border:1px solid transparent; background:transparent; font-size:13.5px; font-weight:600; padding:4px 6px; border-radius:6px; flex:1; min-width:0;}
  .option-row input.inline-edit:focus{border-color:var(--accent); background:var(--surface); outline:none;}
  .option-row .order-controls{display:flex; flex-direction:column; gap:1px;}
  .option-row .order-controls button{width:18px; height:14px; border:none; background:var(--surface-3); color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:3px;}
  .switch{position:relative; width:34px; height:20px; flex:none;}
  .switch input{opacity:0; width:0; height:0;}
  .switch .track{position:absolute; inset:0; background:var(--surface-3); border-radius:999px; cursor:pointer; transition:background .15s; border:1px solid var(--line);}
  .switch .track:before{content:""; position:absolute; width:14px; height:14px; left:2px; top:2px; background:#fff; border-radius:50%; transition:transform .15s; box-shadow:0 1px 2px rgba(0,0,0,0.3);}
  .switch input:checked + .track{background:var(--accent); border-color:var(--accent);}
  .switch input:checked + .track:before{transform:translateX(14px);}
  .add-option-row{display:flex; gap:8px; margin-top:14px;}
  .add-option-row input{flex:1;}

  /* ---------- Misc ---------- */
  .loading-overlay{position:fixed; inset:0; background:var(--bg); z-index:300; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;}
  .spinner{width:30px; height:30px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--accent); animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .gate-screen{max-width:440px; margin:14vh auto 0; text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px; padding:0 20px;}
  .gate-screen svg{width:40px; height:40px; color:var(--muted);}
  .banner{display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border-radius:10px; font-size:12.5px; background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-soft-line);}
  .banner svg{width:16px; height:16px; flex:none; margin-top:1px;}
  .banner.warn{background:rgba(250,178,25,0.12); color:#8a5a00; border-color:rgba(250,178,25,0.35);}
  :root:not([data-theme="light"]) .banner.warn{color:#fab219;}
  /* ---------- Edição em lote ---------- */
  .batch-bar{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:11px 14px; background:var(--accent-soft); border:1px solid var(--accent-soft-line); border-radius:var(--radius-m); margin-bottom:12px; flex-wrap:wrap;}
  .batch-bar-all{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:var(--accent); cursor:pointer;}
  .batch-bar-all input{width:15px; height:15px; accent-color:var(--accent); cursor:pointer;}
  .batch-row-check{width:15px; height:15px; accent-color:var(--accent); cursor:pointer;}

  /* ---------- Rodízios ---------- */
  .rod-legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); margin:-2px 0 2px;}
  .rod-legend-item{display:flex; align-items:center; gap:6px;}
  .rod-group{overflow:hidden; margin-bottom:16px;}
  .rod-group:last-child{margin-bottom:0;}
  .rod-group-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:13px 18px; background:var(--band); border-bottom:1px solid var(--line);}
  .rod-group-head h3{font-size:14.5px; font-weight:800;}
  .rod-group-meta{font-size:12px; color:var(--ink-2); font-weight:600;}
  table.rod-table{min-width:760px; background:transparent;}
  table.rod-table tbody tr{cursor:pointer;}
  table.rod-table tbody td{background:var(--band);}
  table.rod-table tbody tr:hover td{filter:brightness(0.97);}
  :root:not([data-theme="light"]) table.rod-table tbody tr:hover td{filter:brightness(1.15);}
  .pill[data-rodstatus="ok"]{color:var(--good);}
  .pill[data-rodstatus="above"]{color:var(--warning);}
  .pill[data-rodstatus="below"]{color:var(--critical);}
  .pill[data-rodstatus="unmapped"], .pill[data-rodstatus="neutral"]{color:var(--muted);}
  .pill.rod-next{background:var(--accent); color:var(--accent-ink); font-weight:700;}
  .pill.rod-next svg{width:12px; height:12px;}
  .pill[data-rodstatus="hidden"]{color:var(--muted);}
  table.rod-table td.rod-act-cell{width:44px;}
  table.rod-table td.rod-act-cell .icon-btn{width:28px; height:28px;}
  .rod-hidden-wrap{margin-top:10px; padding:0 18px 14px;}
  .rod-hidden-wrap summary{cursor:pointer; font-size:12.5px; font-weight:700; color:var(--ink-2); padding:8px 0; list-style:none;}
  .rod-hidden-wrap summary::-webkit-details-marker{display:none;}
  .rod-hidden-wrap summary:before{content:"▸ "; display:inline-block;}
  .rod-hidden-wrap[open] summary:before{content:"▾ "; }
  table.rod-table-hidden tbody td{opacity:.75;}

  /* ---------- Metas Equipe ---------- */
  table.meta-table{min-width:0; width:100%;}
  table.meta-table th, table.meta-table td{padding-left:10px; padding-right:10px;}
  table.meta-table thead th.meta-pend-th{white-space:normal; line-height:1.25; background:var(--meta-neutral-bg);}
  table.meta-table tbody td.meta-pend{text-align:center; font-weight:700; background:var(--meta-neutral-bg);}
  table.meta-table tbody td.meta-pend.zero{font-weight:500; color:var(--muted);}
  table.meta-table tbody td.meta-pend.clk{cursor:pointer; transition:background .12s ease;}
  table.meta-table tbody td.meta-pend.clk:hover{background:var(--accent-soft); color:var(--accent); text-decoration:underline;}
  table.meta-table tbody td.meta-pend.first, table.meta-table thead th.meta-pend-th.first{border-left:1px solid var(--line);}
  table.meta-table tbody td.meta-pend.last, table.meta-table thead th.meta-pend-th.last{border-right:1px solid var(--line);}
  table.meta-table tbody td.meta-cell{font-weight:700; text-align:center;}
  table.meta-table tbody td.meta-medal{text-align:center; font-size:16px; width:36px;}
  table.meta-table thead th{text-align:center;}
  table.meta-table thead th:first-child, table.meta-table tbody td:first-child{text-align:left;}
  td.meta-cell[data-tier="good"]{background:var(--meta-good-bg);}
  td.meta-cell[data-tier="warn"]{background:var(--meta-warn-bg);}
  td.meta-cell[data-tier="cold"]{background:var(--meta-cold-bg);}
  td.meta-cell[data-tier="neutral"]{background:var(--meta-neutral-bg);}
  tr.meta-total-row{cursor:default; font-weight:800;}
  tr.meta-total-row td{border-top:2px solid var(--line-strong); background:var(--surface-2);}
  tr.meta-total-row:hover td{background:var(--surface-2);}
  tr.meta-total-row td.meta-total-link{cursor:pointer; transition:background .12s ease;}
  tr.meta-total-row td.meta-total-link:hover{background:var(--accent-soft); color:var(--accent); text-decoration:underline;}
  .meta-roster-row{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:9px; border:1px solid var(--line); background:var(--surface);}
  .meta-roster-row + .meta-roster-row{margin-top:8px;}
  .meta-roster-row input.inline-edit{border:1px solid transparent; background:transparent; font-size:13.5px; font-weight:600; padding:4px 6px; border-radius:6px; flex:1; min-width:0;}
  .meta-roster-row input.inline-edit:focus{border-color:var(--accent); background:var(--surface); outline:none;}
  .meta-roster-row .meta-input-wrap{display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; font-weight:700; flex:none;}
  .meta-roster-row .meta-input-wrap input{width:66px; text-align:center;}
  .meta-add-row{display:flex; gap:8px; margin-top:14px; align-items:center; flex-wrap:wrap;}
  .meta-add-row > div:first-child{flex:1; min-width:180px;}
  .meta-add-row input[type="number"]{width:80px;}
  .visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}
  svg{width:1em; height:1em;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:99px;}

  .nav-overlay{position:fixed; inset:0; background:rgba(11,11,11,0.42); z-index:50;}
  @media (max-width:900px){
    #topbar{display:flex;}
    #sidebar{position:fixed; left:0; top:0; height:100vh; height:100dvh; transform:translateX(-100%); transition:transform .2s ease; z-index:60; box-shadow:var(--shadow-2); padding-top:calc(20px + env(safe-area-inset-top,0px));}
    #sidebar.mobile-open{transform:translateX(0);}
    #shell{display:block;}
    #content{padding:20px 16px 70px;}
    .view-head{align-items:flex-start;}
  }
  @media (max-width:640px){
    #content{padding:16px 14px 70px;}
    .charts-grid{grid-template-columns:1fr;}
    .stat-grid{grid-template-columns:1fr 1fr;}
  }

/* RADAR-CSS:BEGIN */
  /* ===== Radar de Soluções ===== */
  .rd-tabs{display:flex; gap:6px; margin:14px 0 14px; flex-wrap:wrap; border-bottom:1px solid var(--line);}
  .rd-tab{background:none; border:none; padding:9px 14px; font:inherit; font-size:13px; font-weight:600; color:var(--ink-2); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
  .rd-tab:hover{color:var(--ink);}
  .rd-tab.active{color:var(--ink); border-bottom-color:var(--accent);}
  .rd-h2{font-size:19px; font-weight:800; letter-spacing:-0.01em;}
  .rd-support{color:var(--ink-2); font-size:13px; margin:4px 0 12px; max-width:760px; line-height:1.5;}
  .rd-input textarea{width:100%; resize:vertical; min-height:110px; line-height:1.5;}
  .rd-opt{margin-top:12px; border:1px solid var(--line); border-radius:10px; padding:10px 14px; background:var(--surface-2);}
  .rd-opt summary{cursor:pointer; font-size:13px; font-weight:600; color:var(--ink-2);}
  .rd-grid, .rd-form{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:12px;}
  .rd-grid .span-2, .rd-form .span-2{grid-column:1/-1;}
  .rd-form{max-height:62vh; overflow:auto; padding-right:6px;}
  .rd-form textarea{width:100%; resize:vertical;}
  .rd-examples{margin-top:12px;}
  .rd-ex-label{font-size:12px; color:var(--muted); font-weight:600; display:block; margin-bottom:6px;}
  .rd-chip{background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:5px 12px; font:inherit; font-size:12px; color:var(--ink-2); cursor:pointer; margin:0 6px 6px 0; text-align:left;}
  .rd-chip:hover{background:var(--accent-soft); border-color:var(--accent-soft-line); color:var(--ink);}
  .rd-mode{font-size:12px; color:var(--muted); display:inline-flex; align-items:center; gap:6px; margin-left:4px;}
  .rd-dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
  .rd-dot.ia{background:var(--good);} .rd-dot.loc{background:var(--warning-fill);}
  .rd-busy{display:flex; align-items:center; gap:14px; margin-top:14px;}
  .rd-spin{width:22px; height:22px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--accent); animation:rdspin 0.9s linear infinite; flex:none;}
  @keyframes rdspin{to{transform:rotate(360deg);}}
  .rd-sub{font-size:12px; color:var(--muted);}
  .rd-clarify{margin-top:14px;}
  .rd-pill-step{display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; background:var(--accent-soft); color:var(--accent); border-radius:999px; padding:3px 10px; margin-bottom:8px;}
  .rd-q{font-size:17px; font-weight:700; margin:6px 0 4px;}
  .rd-opts{margin:10px 0;}
  .rd-qa{display:flex; flex-direction:column; gap:2px; padding:8px 10px; background:var(--surface-2); border-radius:8px; margin:6px 0; font-size:12.5px;}
  .rd-qa span{color:var(--ink-2);}
  .rd-resbar{display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin:16px 0 10px;}
  .rd-resbar-actions{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap;}
  .rd-src-badge{font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px;}
  .rd-src-badge.ia{background:var(--accent-soft); color:var(--accent);} .rd-src-badge.loc{background:var(--meta-warn-bg); color:var(--warning);}
  .rd-warn{background:var(--meta-warn-bg); color:var(--ink); border-color:var(--warning-fill); margin-bottom:12px;}
  .rd-disc{margin-top:14px; background:var(--surface-2); color:var(--ink-2); border-color:var(--line);}
  .rd-hist{margin-bottom:12px; font-size:13px;}
  .rd-sec{margin-top:12px;}
  .rd-sec-head{display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .rd-sec-head h3{font-size:15px; font-weight:800;}
  .rd-num{width:24px; height:24px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-weight:800; font-size:12px; display:inline-flex; align-items:center; justify-content:center; flex:none;}
  .rd-num.warn{background:var(--warning-fill);}
  .rd-p{font-size:13.5px; line-height:1.55; margin:4px 0; white-space:pre-wrap;}
  .rd-lbl{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:14px 0 4px;}
  .rd-kv{display:flex; gap:10px; font-size:13px; margin:4px 0; flex-wrap:wrap;} .rd-kv b{min-width:140px; color:var(--ink-2);}
  .rd-list{margin:4px 0 0 18px; font-size:13px; line-height:1.55; display:flex; flex-direction:column; gap:3px;}
  .rd-list.rd-muted, .rd-muted{color:var(--muted);}
  .rd-warnlist li::marker{color:var(--warning);}
  .rd-src a{color:var(--info-blue); word-break:break-word;} .rd-src-k{font-size:11px; color:var(--muted);}
  .rd-prod{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:flex-start;}
  .rd-prod-name{font-size:18px; font-weight:800;}
  .rd-prod-badges{display:flex; gap:6px; flex-wrap:wrap;}
  .rd-badge{display:inline-flex; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--surface-3); color:var(--ink-2);}
  .rd-badge.rd-alta{background:var(--meta-good-bg); color:var(--good);} .rd-badge.rd-possivel{background:var(--meta-warn-bg); color:var(--warning);}
  .rd-badge.rd-nc{background:var(--surface-3); color:var(--muted);} .rd-badge.rd-warnb{background:rgba(208,59,59,0.12); color:var(--critical);}
  .rd-tag{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:6px; text-transform:none; letter-spacing:0; margin-left:6px; white-space:nowrap;}
  .rd-tag.ok{background:var(--meta-good-bg); color:var(--good);} .rd-tag.hyp{background:var(--meta-warn-bg); color:var(--warning);}
  .rd-tag.now{background:var(--accent-soft); color:var(--accent);} .rd-tag.later{background:var(--surface-3); color:var(--ink-2);}
  .rd-two{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;}

function qs(sel, root){ return (root||document).querySelector(sel); }
function qsa(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function el(tag, attrs, children){
  var node = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function(k){
    if(k==="class") node.className = attrs[k];
    else if(k==="html") node.innerHTML = attrs[k];
    else if(k.indexOf("on")===0 && typeof attrs[k]==="function") node.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k]!==undefined && attrs[k]!==null) node.setAttribute(k, attrs[k]);
  });
  (children||[]).forEach(function(c){ if(c) node.appendChild(typeof c==="string" ? document.createTextNode(c) : c); });
  return node;
}
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
  });
}
function normalizeSearch(s){
  return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

function showToast(message, type){
  var stack = qs("#toast-stack");
  var t = el("div",{class:"toast"+(type?(" "+type):"")});
  var icon = type==="success" ? ICONS.check : (type==="error" ? ICONS.alert : ICONS.info);
  t.innerHTML = icon + '<span></span>';
  t.querySelector("span").textContent = message;
  stack.appendChild(t);
  setTimeout(function(){ t.style.transition="opacity .25s, transform .25s"; t.style.opacity="0"; t.style.transform="translateY(6px)"; setTimeout(function(){ t.remove(); }, 260); }, 4200);
}

function openConfirmModal(opts){
  return new Promise(function(resolve){
    var layer = qs("#modal-layer");
    layer.innerHTML = "";
    var modal = el("div",{class:"modal"});
    modal.innerHTML =
      '<div class="modal-icon">'+(opts.icon==="check"?ICONS.check:opts.icon==="alert"?ICONS.alert:ICONS.edit)+'</div>'+
      '<h2></h2><p class="desc"></p>'+
      '<div class="modal-actions">'+
        '<button class="btn btn-secondary" data-act="cancel"></button>'+
        '<button class="btn btn-primary" data-act="confirm"></button>'+
      '</div>';
    modal.querySelector("h2").textContent = opts.title||"Confirmar";
    modal.querySelector(".desc").textContent = opts.desc||"";
    modal.querySelector('[data-act="cancel"]').textContent = opts.cancelLabel||"Cancelar";
    modal.querySelector('[data-act="confirm"]').textContent = opts.confirmLabel||"Confirmar";
    if(opts.danger) modal.querySelector('[data-act="confirm"]').className = "btn btn-danger";
    var overlay = el("div",{class:"modal-overlay"});
    layer.appendChild(overlay); layer.appendChild(modal);
    layer.classList.add("open");
    function close(val){ layer.classList.remove("open"); layer.innerHTML=""; resolve(val); }
    overlay.addEventListener("click", function(){ close(false); });
    modal.querySelector('[data-act="cancel"]').addEventListener("click", function(){ close(false); });
    modal.querySelector('[data-act="confirm"]').addEventListener("click", function(){ close(true); });
  });
}

function openCustomModal(buildFn, opts){
  var layer = qs("#modal-layer");
  layer.innerHTML = "";
  var modal = el("div",{class:"modal"+((opts&&opts.wide)?" wide":"")+((opts&&opts.full)?" full":"")});
  var overlay = el("div",{class:"modal-overlay"});
  layer.appendChild(overlay); layer.appendChild(modal);
  layer.classList.add("open");
  function close(){ layer.classList.remove("open"); layer.innerHTML=""; }
  overlay.addEventListener("click", function(){ if(!opts||!opts.persistent) close(); });
  buildFn(modal, close);
  return close;
}

function rNorm(s){
  return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
}
function rStem(w){
  if(w.length>4){ w = w.replace(/coes$/,"cao").replace(/oes$/,"ao").replace(/aes$/,"ao").replace(/ais$/,"al").replace(/eis$/,"el").replace(/ns$/,"m"); }
  if(w.length>3) w = w.replace(/s$/,"");
  return w.length>6 ? w.slice(0,6) : w;
}
function rTokens(s){
  var out = [];
  rNorm(s).split(" ").forEach(function(w){
    if(!w || R_STOPSET[w]) return;
    if(w.length<2) return;
    if(/^\d+$/.test(w)) return;
    out.push(rStem(w));
  });
  return out;
}
function rUniq(a){ var m={}, o=[]; a.forEach(function(x){ if(!m[x]){ m[x]=1; o.push(x); } }); return o; }
function rLev(a, b){
  if(a===b) return 0;
  var la=a.length, lb=b.length;
  if(Math.abs(la-lb)>1) return 2;
  var prev=[], cur=[], i, j;
  for(j=0;j<=lb;j++) prev[j]=j;
  for(i=1;i<=la;i++){
    cur[0]=i;
    for(j=1;j<=lb;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
    }
    prev = cur.slice();
  }
  return prev[lb];
}

/* ---- Índice ---- */
function rBuildIndex(kb){
  var N = kb.length, df = {}, docs = {};
  kb.forEach(function(p){
    var w = {};
    function add(text, wt){ rTokens(text).forEach(function(t){ if(!(t in w) || w[t]<wt) w[t]=wt; }); }
    (p.palavras||[]).forEach(function(x){ add(x, rTokens(x).length>=2 ? 1.5 : 3); });
    (p.dores||[]).forEach(function(x){ add(x,2); });
    add(p.nome,2); add(p.categoria,2);
    add(p.descricao,1);
    (p.funcionalidades||[]).forEach(function(x){ add(x,1); });
    (p.casosUso||[]).forEach(function(x){ add(x,1); });
    Object.keys(w).forEach(function(t){ df[t] = (df[t]||0)+1; });
    var phrases = [];
    (p.palavras||[]).forEach(function(x){
      var t = rTokens(x); if(t.length>=2) phrases.push(rUniq(t));
    });
    var dorTokens = (p.dores||[]).map(function(d){ return rUniq(rTokens(d)); });
    docs[p.id] = {w:w, phrases:phrases, dorTokens:dorTokens};
  });
  var idf = {};
  Object.keys(df).forEach(function(t){ idf[t] = Math.log(1 + N/df[t]); });
  return {kb:kb, docs:docs, idf:idf, vocab:Object.keys(df), N:N};
}

 [/\b(funcionario|colaborador|empregado)s?\s+(novo|novos|entrando|admitido)/, "admissao"]
];
function rExpand(text){
  var n = rNorm(text), add = [];
  R_SYN.forEach(function(r){ if(r[0].test(n)) add.push(r[1]); });
  return add.join(" ");
}
function rQueryKeys(text, index){
  var raw = rUniq(rTokens(text));
  var ext = rUniq(rTokens(rExpand(text))).filter(function(k){ return raw.indexOf(k)<0 && index.idf[k]; });
  var keys = [], typo = 0;
  ext.forEach(function(k){ keys.push({k:k, f:0.7}); });
  raw.forEach(function(k){
    if(index.idf[k]){ keys.push({k:k, f:1}); return; }
    if(k.length>=5){
      var best = null;
      for(var i=0;i<index.vocab.length;i++){
        var v = index.vocab[i];
        if(v.length<5) continue;
        if(rLev(k, v)<=1){ best = v; break; }
      }
      if(best){ keys.push({k:best, f:0.8}); typo++; }
    }
  });
  return {keys:keys, raw:raw, typo:typo};
}

/* Pontua todas as soluções para um texto. Retorna lista ordenada. */
function rScore(text, index){
  var q = rQueryKeys(text, index);
  var keySet = {}; q.keys.forEach(function(x){ keySet[x.k] = x.f; });
  var mass = 0; q.keys.forEach(function(x){ mass += (index.idf[x.k]||0)*x.f; });
  var res = index.kb.map(function(p){
    var d = index.docs[p.id], s = 0, hits = [], strong = 0, phraseHit = false;
    q.keys.forEach(function(x){
      var wt = d.w[x.k];
      if(wt){ s += wt * (index.idf[x.k]||0) * x.f; hits.push(x.k); if(wt>=2) strong += (x.f>=1 ? 1 : 0.5); }
    });
    d.phrases.forEach(function(ph){
      var all = ph.every(function(k){ return keySet[k]; });
      if(all){ s += 2 * ph.length; phraseHit = true; }
    });
    var bestDor = 0, bestIdx = -1;
    d.dorTokens.forEach(function(dt, i){
      if(!dt.length) return;
      var inter = 0, tot = 0;
      dt.forEach(function(k){ var v = index.idf[k]||0; tot += v; if(keySet[k]) inter += v; });
      var cov = tot ? inter/tot : 0;
      if(cov>bestDor){ bestDor = cov; bestIdx = i; }
    });
    s += 6 * bestDor;
    return {id:p.id, score:s, dorCov:bestDor, dorIdx:bestIdx, hits:hits, strong:strong, phrase:phraseHit};
  });
  var outFlag = R_OUT.test(rNorm(text));
  res.forEach(function(r){ r.out = outFlag; });
  res.sort(function(a,b){ return b.score-a.score; });
  return {list:res, mass:mass, nKeys:q.keys.length, nRaw:q.raw.length, typo:q.typo};
}

/* ---- Limiares (calibrados em testes) ---- */
var R_T = {alta:14, possivel:8, minima:4.5, clarify:7};

function rAderencia(score, second, ev){
  ev = ev || {strong:9, dorCov:1, phrase:true};
  var solid = ev.strong>=3 && (ev.dorCov>=0.3 || ev.phrase);
  var some = ev.strong>=3 || ev.dorCov>=0.35 || ev.phrase;
  if(score >= R_T.alta && solid && (score >= second*1.2 || second < R_T.possivel)) return "Alta";
  if(score >= R_T.possivel && some) return "Possível";
  return "Não confirmada";
}
var R_OUT = /\b(seguro de vida|seguro saude|plano de saude|consorcio|carro|automovel|imovel|aluguel|viagem de lazer|ferias da familia|comprar um caminhao|financiar)\b/;
function rLowConf(top){ return top.score < R_T.minima || (top.strong<=2 && top.dorCov<0.3 && !top.phrase) || (top.out && top.dorCov<0.45 && !top.phrase); }
function rFill(text, ctx){
  var emp = (ctx && ctx.empresa) ? String(ctx.empresa).split(/[,;\/-]/)[0].trim() : "";
  return String(text||"").replace(/\{contato\}/g,"[nome]").replace(/\{empresa\}/g, emp || "sua empresa");
}
function rById(kb, id){ for(var i=0;i<kb.length;i++){ if(kb[i].id===id) return kb[i]; } return null; }

function rCtxText(ctx){
  var parts = [ctx.texto||""];
  ["empresa","cargo","area","sistema","impacto"].forEach(function(k){ if(ctx[k]) parts.push(ctx[k]); });
  (ctx.historico||[]).forEach(function(h){ parts.push(h.a||""); });
  return parts.join(". ");
}

/* ---- Perguntas de esclarecimento locais ---- */
var R_AREAS = ["Financeiro / despesas","Fiscal / impostos","RH / folha / ponto","Vendas / comercial","Atendimento ao cliente","Logística / estoque","Sistema de gestão (ERP)","Marketplaces / e-commerce"];
function rLocalClarify(ctx, sc, kb){
  var rodada = (ctx.historico||[]).length;
  var cand = sc.list.filter(function(x){ return x.score>=R_T.minima; }).slice(0,2);
  if(rodada===0){
    return {pergunta:"Em qual área da empresa o problema acontece com mais força?", motivo:"A descrição ainda é ampla para indicar uma solução com segurança.", opcoes:R_AREAS};
  }
  if(cand.length){
    var p = rById(kb, cand[0].id);
    var q = (p.diagnostico||[])[0];
    if(q) return {pergunta:rFill(q, ctx), motivo:"Esta resposta ajuda a confirmar se "+p.nome+" realmente se encaixa.", opcoes:[]};
  }
  return {pergunta:"Qual ferramenta, sistema ou planilha o lead usa hoje para lidar com esse processo?", motivo:"Saber como o processo é feito hoje mostra onde está a dor.", opcoes:[]};
}

/* ---- Análise local (sem IA) ---- */
function rLocalAnalyze(ctx, index, opts){
  opts = opts || {};
  var kb = index.kb;
  var text = rCtxText(ctx);
  var sc = rScore(text, index);
  var list = sc.list;
  var top = list[0], second = list[1] || {score:0};
  var rodada = (ctx.historico||[]).length;
  var forced = opts.forcar || rodada>=3;

  // sem nenhum termo reconhecido
  if(rLowConf(top)){
    if(!forced && rodada===0){
      return {status:"clarify", source:"local", clarify:rLocalClarify(ctx, sc, kb)};
    }
    return rNoFit(ctx, sc, kb, "local");
  }
  if(top.score < R_T.clarify && !forced && rodada<3){
    return {status:"clarify", source:"local", clarify:rLocalClarify(ctx, sc, kb)};
  }
  var p = rById(kb, top.id);
  var ader = rAderencia(top.score, second.score, top);

  // sinais reconhecidos
  var sinais = [];
  (function(){
    var d = index.docs[p.id];
    var ranked = d.dorTokens.map(function(dt,i){
      var inter=0, tot=0;
      var qk = rQueryKeys(text, index).keys, ks={}; qk.forEach(function(x){ ks[x.k]=1; });
      dt.forEach(function(k){ var v=index.idf[k]||0; tot+=v; if(ks[k]) inter+=v; });
      return {i:i, cov: tot? inter/tot:0};
    }).sort(function(a,b){ return b.cov-a.cov; });
    ranked.slice(0,3).forEach(function(r){ if(r.cov>=0.2) sinais.push(p.dores[r.i]); });
  })();
  if(!sinais.length && p.dores[0]) sinais.push("Palavras do relato coincidem com o tema "+p.categoria.toLowerCase());

  var comp = [], used = {}; used[p.id]=1;
  (p.complementares||[]).forEach(function(c){
    var cs = list.filter(function(x){ return x.id===c.id; })[0];
    var cp = rById(kb, c.id);
    if(!cp || !cs) return;
    if(!rLowConf(cs) && cs.score>=R_T.possivel){
      used[cp.id]=1;
      var dor = cs.dorIdx>=0 && cs.dorCov>=0.2 ? cp.dores[cs.dorIdx] : "";
      comp.push({id:cp.id, aderencia:rAderencia(cs.score, 0, cs)==="Alta"?"Possível":rAderencia(cs.score,0,cs), porQue:c.porque,
        necessidadeAdicional: dor ? "Sinal no relato: "+dor : "O relato menciona termos ligados a esta solução; confirmar com o lead.",
        quando: cs.score>=R_T.possivel ? "agora" : "depois"});
    }
  });
  var outras = list.filter(function(x){ return !used[x.id] && !rLowConf(x); }).slice(0,3).map(function(x){
    var op = rById(kb, x.id);
    return {id:op.id, aderencia:rAderencia(x.score, 0, x)==="Alta"?"Possível":rAderencia(x.score,0,x), motivo:"Termos do relato também aparecem em: "+op.categoria.toLowerCase()+"."};
  });

  var ressalvas = [];
  if(p.relacao && p.relacao.status!=="confirmada") ressalvas.push("Relação com o ecossistema: "+p.relacao.texto);
  (p.naoFaz||[]).slice(0,2).forEach(function(x){ ressalvas.push(x); });
  if(ader!=="Alta") ressalvas.unshift("Aderência "+ader.toLowerCase()+": valide com o lead antes de apresentar como solução definitiva.");

  var proximo;
  if(ader==="Alta") proximo = {tipo:"agendar_especialista", texto:"Use o gancho acima para agendar com um especialista da solução."};
  else if(ader==="Possível") proximo = {tipo:"pergunta_adicional", texto:"Faça a pergunta consultiva (ou uma de diagnóstico da lista) para confirmar a aderência antes de propor o agendamento."};
  else proximo = {tipo:"avaliacao_comercial", texto:"Aderência ainda não confirmada: leve o caso para avaliação comercial antes de prometer solução."};
  if(comp.length && ader!=="Alta" && comp[0].quando==="agora") proximo = {tipo:"investigar_complementar", texto:"Há sinais de outra necessidade no relato: investigue "+rById(kb, comp[0].id).nome+" na conversa."};

  return {
    status:"ok", source:"local",
    entendimento:{
      resumo:"Análise local por termos e sinônimos (sem IA): o relato se aproxima de “"+p.categoria+"”.",
      dorPrincipal:sinais[0]||"", area:p.area, sinais:sinais,
      lacunas:(ctx.historico||[]).length? [] : ["Quanto mais detalhes (sistema atual, impacto, área), mais precisa a recomendação."]
    },
    principal:{
      id:p.id, aderencia:ader,
      porQueFazSentido:"O relato coincide com dores documentadas para "+p.nome+": "+sinais.slice(0,2).join("; ")+".",
      problemasQueResolve:(p.dores||[]).slice(0,4),
      beneficios:(p.beneficios||[]).slice(0,3).map(function(b){ return {texto:b, tipo:"confirmado"}; }),
      justificativaComercial:rFill(p.comoExplicar, ctx),
      funcionalidades:(p.funcionalidades||[]).slice(0,6),
      ressalvas:ressalvas
    },
    argumentacao:{comoExplicar:rFill(p.comoExplicar, ctx), comoFalar:rFill(p.comoFalar, ctx)},
    perguntaConsultiva:rFill(p.perguntaConsultiva, ctx),
    gancho:rFill(p.gancho, ctx),
    complementares:comp, outras:outras, proximoPasso:proximo,
    raciocinio:[
      "Termos do relato reconhecidos (normalizados): "+sc.list[0].hits.slice(0,10).join(", ")+(sc.typo? " (inclui correção de digitação em "+sc.typo+" termo(s))":""),
      "Pontuação local: "+top.score.toFixed(1)+" para "+p.nome+(second.score? " contra "+second.score.toFixed(1)+" da segunda colocada":""),
      "Regra de aderência: Alta ≥ "+R_T.alta+" com folga sobre a segunda; Possível ≥ "+R_T.possivel+"; abaixo disso, Não confirmada."
    ]
  };
}

function rNoFit(ctx, sc, kb, source){
  var near = sc.list.filter(function(x){ return x.score>0; }).slice(0,2).map(function(x){
    var p = rById(kb, x.id); return {id:p.id, aderencia:"Não confirmada", motivo:"Há apenas sinais fracos de relação com "+p.categoria.toLowerCase()+"."};
  });
  return {
    status:"no_fit", source:source||"local",
    semAderencia:{
      motivo:"Nenhuma solução da base atual se encaixa de forma segura na dor descrita.",
      sugestao:"Não force uma solução. Registre a dor com as palavras do lead e leve para avaliação comercial; se a necessidade for recorrente, peça ao responsável pela base para incluir a solução correspondente."
    },
    outras:near,
    proximoPasso:{tipo:"avaliacao_comercial", texto:"Encaminhar para avaliação comercial. Este Radar não define responsáveis nem critérios de roteamento."},
    raciocinio:["Pontuação máxima local abaixo do mínimo ("+R_T.minima+")."]
  };
}

" \"clarify\": {\"pergunta\": string, \"motivo\": string, \"opcoes\": string[] (0 a 6)}   // só se status = clarify",
" \"entendimento\": {\"resumo\": string, \"dorPrincipal\": string, \"area\": string, \"sinais\": string[], \"lacunas\": string[]}   // status ok ou no_fit",
" \"principal\": {\"id\": string, \"aderencia\": \"Alta\"|\"Possível\"|\"Não confirmada\", \"porQueFazSentido\": string, \"problemasQueResolve\": string[], \"beneficios\": [{\"texto\": string, \"tipo\": \"confirmado\"|\"hipotese\"}], \"justificativaComercial\": string, \"funcionalidades\": string[] (apenas da base), \"ressalvas\": string[]}   // só se ok",
" \"argumentacao\": {\"comoExplicar\": string, \"comoFalar\": string},",
" \"perguntaConsultiva\": string, \"gancho\": string,   // só se ok",
" \"complementares\": [{\"id\": string, \"aderencia\": string, \"porQue\": string, \"necessidadeAdicional\": string, \"quando\": \"agora\"|\"depois\"}],",
" \"outras\": [{\"id\": string, \"aderencia\": string, \"motivo\": string}]   // até 3 soluções relacionadas para consulta",
" \"semAderencia\": {\"motivo\": string, \"sugestao\": string}   // só se no_fit",
" \"proximoPasso\": {\"tipo\": \"agendar_especialista\"|\"pergunta_adicional\"|\"investigar_complementar\"|\"avaliacao_comercial\", \"texto\": string},",
" \"raciocinio\": string[] (3 a 6 passos curtos: sinais usados, por que esta solução e não as outras, o que ficou incerto)",
"}"
].join("\n");

function rBuildPrompt(ctx, index, opts){
  opts = opts || {};
  var kb = index.kb;
  var sc = rScore(rCtxText(ctx), index);
  var max = opts.maxCand || 8;
  var cands = sc.list.filter(function(x){ return x.score>0; }).slice(0,max).map(function(x){ return x.id; });
  // sempre inclui as 3 primeiras do ranking, mesmo com score baixo, e Trevo/ERP se citados
  if(cands.length<3) sc.list.slice(0,3).forEach(function(x){ if(cands.indexOf(x.id)<0) cands.push(x.id); });
  var build = function(c){
    var detail = c.map(function(id){ return rCompactProduct(rById(kb,id)); });
    var catalog = kb.map(rCatalogLine).join("\n");
    var lead = {
      relato: ctx.texto||"", empresaOuSegmento: ctx.empresa||"", cargoDoContato: ctx.cargo||"",
      processoOuArea: ctx.area||"", sistemaAtual: ctx.sistema||"", impactoNoNegocio: ctx.impacto||""
    };
    var hist = (ctx.historico||[]).map(function(h,i){ return (i+1)+". Pergunta do Radar: "+h.q+"\n   Resposta do SDR: "+(h.a||"(sem resposta)"); }).join("\n") || "(nenhuma)";
    var must = (ctx.historico||[]).length>=3 || opts.forcar ? "\nATENÇÃO: o limite de perguntas foi atingido. Responda agora com status ok ou no_fit." : "";
    return R_RULES+"\n\nPERGUNTAS DE ESCLARECIMENTO JÁ FEITAS: "+(ctx.historico||[]).length+" de no máximo 3."+must+
      "\n\nDADOS DO LEAD (informados pelo SDR):\n"+JSON.stringify(lead)+
      "\n\nHISTÓRICO DE ESCLARECIMENTOS:\n"+hist+
      "\n\nCATÁLOGO COMPLETO (id | nome | categoria | resumo) — use para recomendar mesmo fora dos candidatos detalhados:\n"+catalog+
      "\n\nBASE DE CONHECIMENTO DETALHADA (candidatos mais prováveis; a data de validação é "+(kb[0]&&kb[0].validado||"")+"):\n"+JSON.stringify(detail)+
      "\n\n"+R_SCHEMA;
  };
  var prompt = build(cands);
  while(prompt.length>58000 && cands.length>2){ cands.pop(); prompt = build(cands); }
  return {prompt:prompt, candidatos:cands};
}

/* ---- Validação/normalização da resposta da IA ---- */
function rStr(x, max){ return (typeof x==="string" ? x : (x==null?"":String(x))).trim().slice(0, max||1200); }
function rArr(x, max, n){ return (Array.isArray(x)?x:[]).slice(0,n||8).map(function(i){ return rStr(i,max||500); }).filter(Boolean); }
function rLevel(x){
  var n = rNorm(x);
  if(n==="alta") return "Alta";
  if(n==="possivel") return "Possível";
  return "Não confirmada";
}
var R_PROX = ["agendar_especialista","pergunta_adicional","investigar_complementar","avaliacao_comercial"];
function rNormalizeAI(raw, kb){
  if(!raw || typeof raw!=="object") return null;
  var st = rNorm(raw.status).replace(/ /g,"_");
  if(st==="clarify" || st==="esclarecer"){
    var c = raw.clarify || raw;
    var q = rStr(c.pergunta, 400);
    if(!q) return null;
    return {status:"clarify", source:"ia", clarify:{pergunta:q, motivo:rStr(c.motivo,400), opcoes:rArr(c.opcoes,80,6)}};
  }
  var ent = raw.entendimento || {};
  var out = {
    source:"ia",
    entendimento:{resumo:rStr(ent.resumo,800), dorPrincipal:rStr(ent.dorPrincipal,400), area:rStr(ent.area,120), sinais:rArr(ent.sinais,300,6), lacunas:rArr(ent.lacunas,300,5)},
    outras:(Array.isArray(raw.outras)?raw.outras:[]).filter(function(o){ return o && rById(kb, o.id); }).slice(0,3).map(function(o){ return {id:o.id, aderencia:rLevel(o.aderencia), motivo:rStr(o.motivo,300)}; }),
    raciocinio:rArr(raw.raciocinio,400,8)
  };
  var px = raw.proximoPasso || {};
  var tipo = R_PROX.indexOf(px.tipo)>=0 ? px.tipo : "avaliacao_comercial";
  out.proximoPasso = {tipo:tipo, texto:rStr(px.texto,500)};
  if(st==="no_fit" || st==="sem_aderencia"){
    var sa = raw.semAderencia || {};
    out.status = "no_fit";
    out.semAderencia = {motivo:rStr(sa.motivo,600) || "Nenhuma solução da base se encaixa de forma segura.", sugestao:rStr(sa.sugestao,600)};
    out.proximoPasso.tipo = "avaliacao_comercial";
    return out;
  }
  var pr = raw.principal || {};
  if(!rById(kb, pr.id)) return null;
  out.status = "ok";
  out.principal = {
    id:pr.id, aderencia:rLevel(pr.aderencia),
    porQueFazSentido:rStr(pr.porQueFazSentido,900),
    problemasQueResolve:rArr(pr.problemasQueResolve,300,6),
    beneficios:(Array.isArray(pr.beneficios)?pr.beneficios:[]).slice(0,6).map(function(b){
      if(typeof b==="string") return {texto:rStr(b,400), tipo:"hipotese"};
      return {texto:rStr(b&&b.texto,400), tipo:(b&&rNorm(b.tipo)==="confirmado")?"confirmado":"hipotese"};
    }).filter(function(b){ return b.texto; }),
    justificativaComercial:rStr(pr.justificativaComercial,900),
    funcionalidades:rArr(pr.funcionalidades,300,8),
    ressalvas:rArr(pr.ressalvas,400,6)
  };
  var ar = raw.argumentacao || {};
  out.argumentacao = {comoExplicar:rStr(ar.comoExplicar,1200), comoFalar:rStr(ar.comoFalar,1200)};
  out.perguntaConsultiva = rStr(raw.perguntaConsultiva,500);
  out.gancho = rStr(raw.gancho,600);
  out.complementares = (Array.isArray(raw.complementares)?raw.complementares:[]).filter(function(c){ return c && rById(kb,c.id) && c.id!==pr.id; }).slice(0,4).map(function(c){
    return {id:c.id, aderencia:rLevel(c.aderencia), porQue:rStr(c.porQue,400), necessidadeAdicional:rStr(c.necessidadeAdicional,400), quando:rNorm(c.quando)==="agora"?"agora":"depois"};
  });
  if(!out.argumentacao.comoExplicar && !out.argumentacao.comoFalar) return null;
  return out;
}

/* ---- Texto para copiar ---- */
function rToText(res, kb, ctx){
  var L = [];
  if(res.status==="no_fit"){
    L.push("RADAR DE SOLUÇÕES — sem solução aderente");
    if(ctx && ctx.texto) L.push("Dor relatada: "+ctx.texto);
    L.push(res.semAderencia.motivo); L.push(res.semAderencia.sugestao);
    return L.join("\n");
  }
  var p = rById(kb, res.principal.id);
  L.push("RADAR DE SOLUÇÕES");
  if(ctx && ctx.texto) L.push("Dor relatada: "+ctx.texto);
  L.push("Solução principal: "+p.nome+" — aderência "+res.principal.aderencia);
  L.push("");
  L.push("Como explicar: "+res.argumentacao.comoExplicar);
  L.push("");
  L.push("Como falar com o lead: "+res.argumentacao.comoFalar);
  L.push("");
  L.push("Pergunta consultiva: "+res.perguntaConsultiva);
  L.push("");
  L.push("Gancho para agendamento: "+res.gancho);
  return L.join("\n");
}

/* ---- Mescla da base padrão com edições salvas (config/radarKB) ---- */
function rMergeKB(base, overrides){
  var map = {}, order = [];
  base.forEach(function(p){ map[p.id] = p; order.push(p.id); });
  (overrides||[]).forEach(function(o){
    if(!o || !o.id) return;
    if(o.__removido){ delete map[o.id]; order = order.filter(function(x){ return x!==o.id; }); return; }
    if(!map[o.id]) order.push(o.id);
    map[o.id] = rFixProduct(o);
  });
  return order.filter(function(id){ return map[id]; }).map(function(id){ return map[id]; });
}
function rFixProduct(p){
  var base = {id:"",nome:"",empresa:"",categoria:"",area:"",relacao:{texto:"",status:"nao_confirmada"},descricao:"",dores:[],funcionalidades:[],beneficios:[],segmentos:[],casosUso:[],naoFaz:[],diagnostico:[],comoExplicar:"",comoFalar:"",perguntaConsultiva:"",gancho:"",complementares:[],lacunas:[],fontes:[],validado:"",palavras:[]};
  Object.keys(base).forEach(function(k){ if(p[k]==null) p[k] = base[k]; });
  return p;
}

  opts = opts || {};

  var sample = await radarGetSample();
  if(sample && currentView==="radar"){
    var pp = rBuildPrompt(RADAR.ctx, RADAR.index, {forcar:forced});
    RADAR.ctl = new AbortController();
    try{
      var raw = await sample.json(pp.prompt, {
        modelTier:"default", cache: !opts.nocache, signal: RADAR.ctl.signal,
        onText: function(){ var m = qs("#rd-busymsg"); if(m) m.textContent = "Montando a recomendação e a argumentação..."; }
      });

      if(res && res.status==="clarify" && forced) res = null;
      if(res) usedAI = true;
      else RADAR.notice = "A resposta da IA veio incompleta; exibindo a análise local por termos e sinônimos.";
    }catch(e){
      var code = e && e.code;

        RADAR.busy = false; RADAR.ctl = null; radarHideBusy();

        return;
      }
      if(code==="not_granted") RADAR.notice = "O uso do Claude não foi autorizado para este painel; exibindo a análise local por termos e sinônimos (menos precisa).";
      else if(code==="rate_limited") RADAR.notice = "Muitas consultas seguidas; exibindo a análise local. Aguarde um instante para usar a IA novamente.";
      else RADAR.notice = "Não foi possível consultar a IA agora ("+((e && e.message)||"erro")+"); exibindo a análise local por termos e sinônimos.";
      res = null;
    }
    RADAR.ctl = null;
  }
  if(!res){
    res = rLocalAnalyze(RADAR.ctx, RADAR.index, {forcar:forced});
    if(!sample && !RADAR.notice) RADAR.notice = "IA indisponível neste acesso: exibindo a análise local por termos e sinônimos (menos precisa).";
  }
  RADAR.busy = false;
  if(currentView!=="radar") return;
  radarHideBusy();
  if(res.status==="clarify"){ RADAR.clarify = res.clarify; RADAR.result = null; radarRenderClarify(); }
  else { RADAR.result = res; RADAR.clarify = null; if(RADAR.tab==="radar") radarRenderResult(); }
}

function radarAnswer(skip){

  radarRun({forcar:!!skip});

  qs("#rd-kb-imp").addEventListener("click", function(){ qs("#rd-kb-file").click(); });
  qs("#rd-kb-file").addEventListener("change", function(ev){
    var f = ev.target.files && ev.target.files[0]; if(!f) return;
    var rd = new FileReader();
    rd.onload = async function(){
      try{
        var data = JSON.parse(String(rd.result||"[]"));
        if(!Array.isArray(data)) throw new Error("O arquivo deve conter uma lista de soluções.");
        var valid = data.filter(function(p){ return p && p.id && p.nome; }).map(function(p){ return rFixProduct(p); });
        if(!valid.length) throw new Error("Nenhuma solução válida encontrada (cada item precisa de id e nome).");
        var ok = await openConfirmModal({title:"Importar "+valid.length+" solução(ões)?", desc:"Soluções com o mesmo id substituem a versão atual; as demais serão adicionadas.", confirmLabel:"Importar"});
        if(!ok) return;
        var map = {}; RADAR.overrides.forEach(function(o){ map[o.id] = o; });
        valid.forEach(function(p){ map[p.id] = p; });
        await radarSaveOverrides(Object.keys(map).map(function(k){ return map[k]; }));
      }catch(e){ showToast("Importação falhou: "+(e && e.message || "arquivo inválido"),"error"); }
    };
    rd.readAsText(f);
    ev.target.value = "";
  });
}
async function radarSaveOverrides(list){
  try{
    await APP.db.doc("config/radarKB").set({items:list, updatedAt:new Date().toISOString(), updatedBy:(APP.me && APP.me.name)||null});
    RADAR.overrides = list; radarRebuild();
    showToast("Base de conhecimento atualizada.","success");
    if(RADAR.tab==="base") radarRenderBase();
  }catch(e){
    showToast("Não foi possível salvar a base: "+((e&&e.message)||"erro"),"error");
  }
}
function radarLines(s){ return String(s||"").split(/\r?\n/).map(function(x){ return x.trim(); }).filter(Boolean); }
function radarEditProduct(id){
  var p = id ? radarProd(id) : rFixProduct({id:"", nome:"", relacao:{texto:"",status:"nao_confirmada"}, validado:todayISO()});
  var isNew = !id;
  openCustomModal(function(modal, close){
    modal.classList.add("wide");
    function ta(key, label, val, rows, hint){ return '<div class="field"><label>'+label+'</label><textarea class="input" id="kb-'+key+'" rows="'+(rows||3)+'">'+escapeHtml(val)+'</textarea>'+(hint?'<p class="fieldhint">'+hint+'</p>':'')+'</div>'; }
    function tx(key, label, val, ro){ return '<div class="field"><label>'+label+'</label><input class="input" id="kb-'+key+'" value="'+escapeHtml(val)+'"'+(ro?' readonly':'')+'></div>'; }
    modal.innerHTML =
      '<h2 style="margin:0">'+(isNew?'Nova solução':'Editar: '+escapeHtml(p.nome))+'</h2>'+
      '<div class="rd-form">'+
        tx("id","Identificador (sem espaços, ex.: minha-solucao)", p.id, !isNew)+tx("nome","Nome oficial", p.nome)+
        tx("empresa","Empresa responsável", p.empresa)+tx("categoria","Categoria", p.categoria)+tx("area","Grupo (ex.: Gestão de Vendas)", p.area)+
        '<div class="field"><label>Relação com o ecossistema Sankhya</label><select class="input" id="kb-relstatus"><option value="confirmada">Confirmada no site oficial</option><option value="parcial">Parcialmente confirmada</option><option value="nao_confirmada">Não confirmada</option></select></div>'+
        '<div class="field span-2"><label>Texto sobre a relação</label><input class="input" id="kb-reltexto" value="'+escapeHtml(p.relacao.texto)+'"></div>'+
        '<div class="field span-2"><label>Descrição simples</label><textarea class="input" id="kb-descricao" rows="3">'+escapeHtml(p.descricao)+'</textarea></div>'+
        ta("dores","Dores atendidas (uma por linha, em linguagem do lead)", (p.dores||[]).join("\n"), 5)+
        ta("funcionalidades","Funcionalidades CONFIRMADAS (uma por linha)", (p.funcionalidades||[]).join("\n"), 5)+
        ta("beneficios","Benefícios/diferenciais documentados (uma por linha)", (p.beneficios||[]).join("\n"), 3)+
        ta("segmentos","Segmentos (uma por linha)", (p.segmentos||[]).join("\n"), 3)+
        ta("casosUso","Casos de uso (uma por linha)", (p.casosUso||[]).join("\n"), 3)+
        ta("naoFaz","O que não faz / limites (uma por linha)", (p.naoFaz||[]).join("\n"), 3)+
        ta("diagnostico","Perguntas de diagnóstico (uma por linha)", (p.diagnostico||[]).join("\n"), 4)+
        ta("comoExplicar","Argumentação: como explicar a solução", p.comoExplicar, 3)+
        ta("comoFalar","Argumentação: como falar com o lead (use {contato} e {empresa})", p.comoFalar, 3)+
        ta("perguntaConsultiva","Pergunta consultiva", p.perguntaConsultiva, 2)+
        ta("gancho","Gancho para agendamento", p.gancho, 2)+
        ta("complementares","Complementares (uma por linha: id | por que | quando)", (p.complementares||[]).map(function(c){ return c.id+" | "+c.porque+" | "+c.quando; }).join("\n"), 3)+
        ta("lacunas","Inconsistências e lacunas conhecidas (uma por linha)", (p.lacunas||[]).join("\n"), 3)+
        ta("fontes","Fontes (uma por linha: título | url | tipo)", (p.fontes||[]).map(function(f){ return f.t+" | "+f.u+" | "+f.k; }).join("\n"), 3)+
        tx("validado","Data da última validação (AAAA-MM-DD)", p.validado)+
        ta("palavras","Palavras e expressões que o lead usa (uma por linha; usadas pela análise local)", (p.palavras||[]).join("\n"), 4)+
      '</div>'+
      '<div class="modal-actions"><button class="btn btn-secondary" id="kb-cancel">Cancelar</button><button class="btn btn-primary" id="kb-save">Salvar</button></div>';
    qs("#kb-relstatus", modal).value = p.relacao.status;
    qs("#kb-cancel", modal).addEventListener("click", close);
    qs("#kb-save", modal).addEventListener("click", async function(){
      function v(k){ return (qs("#kb-"+k, modal)||{}).value||""; }
      var nid = v("id").trim().toLowerCase().replace(/[^a-z0-9-]+/g,"-").replace(/^-+|-+$/g,"");
      if(!nid || !v("nome").trim()){ showToast("Informe identificador e nome.","error"); return; }
      if(isNew && RADAR.kb.some(function(x){ return x.id===nid; })){ showToast("Já existe uma solução com esse identificador.","error"); return; }
      var obj = {
        id:nid, nome:v("nome").trim(), empresa:v("empresa").trim(), categoria:v("categoria").trim(), area:v("area").trim(),
        relacao:{status:v("relstatus"), texto:v("reltexto").trim()}, descricao:v("descricao").trim(),
        dores:radarLines(v("dores")), funcionalidades:radarLines(v("funcionalidades")), beneficios:radarLines(v("beneficios")),
        segmentos:radarLines(v("segmentos")), casosUso:radarLines(v("casosUso")), naoFaz:radarLines(v("naoFaz")), diagnostico:radarLines(v("diagnostico")),
        comoExplicar:v("comoExplicar").trim(), comoFalar:v("comoFalar").trim(), perguntaConsultiva:v("perguntaConsultiva").trim(), gancho:v("gancho").trim(),
        complementares:radarLines(v("complementares")).map(function(l){ var a = l.split("|").map(function(x){ return x.trim(); }); return {id:a[0], porque:a[1]||"", quando:a[2]||""}; }).filter(function(c){ return c.id; }),
        lacunas:radarLines(v("lacunas")),
        fontes:radarLines(v("fontes")).map(function(l){ var a = l.split("|").map(function(x){ return x.trim(); }); return {t:a[0]||a[1]||"Fonte", u:a[1]||"", k:a[2]||""}; }),
        validado:v("validado").trim()||todayISO(), palavras:radarLines(v("palavras"))
      };
      var list = RADAR.overrides.filter(function(o){ return o.id!==nid; }).concat([obj]);
      close();
      await radarSaveOverrides(list);
    });
  }, {wide:true});
}

/* RADAR:END */
async function boot(){
  var sel = qs(".theme-select");
  sel.value = document.documentElement.getAttribute("data-theme")==="light" ? "light" : "dark";
  sel.addEventListener("change", function(){ document.documentElement.setAttribute("data-theme", sel.value); setStoredTheme(sel.value); });
  var c = window.claude;
  if(c && typeof c.use==="function"){
    try{ APP.db = await c.use("db"); }catch(e){ APP.db = null; }
    try{
      APP.userNs = await c.use("user");
      try{ var me = await APP.userNs.me(); APP.me = {id:me.id, name:me.name, canEdit:me.canEdit}; }catch(e){}
      try{ APP.isOwner = !!(await APP.userNs.isOwner()); }catch(e){}
    }catch(e){}
  }
  qs("#view-radar").innerHTML = "";
  renderRadarView();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
